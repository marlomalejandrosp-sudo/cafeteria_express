<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión en tu cuenta de Cafetería Express.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://cafeteriaexpress.com/login.html">
  <title>Iniciar Sesión | Cafetería Express</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <div class="header-contenedor">
      <a href="index.html" class="logo">☕ Express</a>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="servicios.html">Productos</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="login.html" class="activo">Iniciar sesión</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Iniciar Sesión</h1>

    <section class="formulario">
      <form action="#" method="post">
        <div class="campo">
          <label for="usuario">Correo o usuario:</label>
          <input type="text" id="usuario" name="usuario" required placeholder="nombre@correo.com">
        </div>

        <div class="campo">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required minlength="6" placeholder="********">
        </div>

        <div class="campo campo-checkbox">
          <input type="checkbox" id="recordarme" name="recordarme">
          <label for="recordarme">Recordarme</label>
        </div>

        <button type="submit">Entrar</button>
      </form>

      <a href="#" class="enlace-secundario">¿Olvidaste tu contraseña?</a>
      <a href="#" class="enlace-secundario">¿No tienes cuenta? Registrate</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Cafeteria Express. Todos los derechos reservados.</p>
    <p>
      <a href="#">Facebook</a> |
      <a href="#">Instagram</a> |
      <a href="#">Twitter</a>
    </p>
  </footer>

</body>
</html>
